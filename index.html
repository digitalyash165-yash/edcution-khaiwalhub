<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
    radial-gradient(circle at top,#443a20 0%,#181818 38%,#070707 100%);
    color:#fff;
    padding:12px 12px 25px;
}

.container{
    width:100%;
    max-width:460px;
    margin:auto;
    text-align:center;
}

/* SMALL PROFILE PHOTO */
.photo-box{
    width:92px;
    height:92px;
    margin:2px auto 10px;
    padding:2px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff0a0,#d5a900,#fff0a0);
    box-shadow:0 0 15px rgba(255,215,70,.55);
}

.profile-photo{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    object-fit:cover;
    background:#151515;
}

.crown{
    font-size:31px;
    line-height:1;
    margin-top:2px;
    filter:drop-shadow(0 0 9px rgba(255,220,80,.65));
}

h1{
    margin-top:5px;
    font-size:25px;
    line-height:1.1;
    letter-spacing:.5px;
    color:#ffe58a;
}

.subtitle{
    margin-top:8px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:3px;
    color:#ffe477;
}

/* INFO CARDS */
.info{
    margin-top:15px;
    padding:13px;
    border-radius:15px;
    border:1px solid rgba(255,215,90,.32);
    background:rgba(255,255,255,.05);
    box-shadow:0 5px 18px rgba(0,0,0,.3);
    text-align:left;
}

.info-row{
    display:flex;
    align-items:center;
    gap:11px;
}

.icon{
    min-width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,214,75,.08);
    font-size:19px;
}

.info-title{
    color:#fff1bd;
    font-size:15px;
    font-weight:bold;
}

.info-text{
    color:#cfcfcf;
    font-size:12px;
    margin-top:3px;
}

/* TELEGRAM */
.telegram-area{
    margin-top:19px;
}

.telegram-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:52px;
    padding:13px 16px;
    border-radius:32px;
    background:linear-gradient(90deg,#008cff,#00c9ff,#008cff);
    color:#fff !important;
    text-decoration:none !important;
    font-size:17px;
    font-weight:800;
    box-shadow:
    0 0 10px rgba(0,190,255,.5),
    0 0 22px rgba(0,190,255,.2);
    cursor:pointer;
}

.telegram-icon{
    font-size:21px;
    margin-right:7px;
}

/* RATING */
.rating{
    margin-top:16px;
    padding:12px;
    border-radius:17px;
    border:1px solid rgba(0,255,190,.18);
    background:rgba(0,255,190,.03);
}

.stars{
    font-size:18px;
    letter-spacing:2px;
}

.score{
    margin-top:3px;
    color:#32efbd;
    font-size:20px;
    font-weight:bold;
}

.rating-text{
    margin-top:3px;
    color:#999;
    font-size:12px;
}

/* ONLY MANAGED BY YASH ADS */
.managed-title{
    margin-top:17px;
    color:#888;
    font-size:11px;
    letter-spacing:1px;
}

.yash-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:44px;
    margin-top:6px;
    padding:10px 15px;
    border-radius:25px;
    background:rgba(255,212,70,.07);
    border:1px solid rgba(255,212,70,.4);
    color:#ffe477 !important;
    text-decoration:none !important;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.footer{
    margin-top:14px;
    color:#555;
    font-size:9px;
}

@media(min-width:700px){
    .container{
        max-width:440px;
    }
}

@media(max-width:360px){
    .container{
        max-width:100%;
    }

    .photo-box{
        width:82px;
        height:82px;
    }

    h1{
        font-size:23px;
    }

    .subtitle{
        font-size:12px;
    }
}
</style>
