*{

    padding:0;
    box-sizing:border-box;
}

body{

.container{

/* Profile Photo */
.profile-photo{
    width:125px;
    height:125px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:5px auto 15px;
    border:3px solid #ffe477;

}

.crown{
    font-size:45px;

h1{
    margin-top:7px;
    font-size:32px;
    line-height:1.12;
    letter-spacing:1px;
    color:#ffe58a;
    text-shadow:0 0 15px rgba(255,214,75,.35);
}

.subtitle{
    margin-top:12px;
    font-size:17px;
    font-weight:bold;
    letter-spacing:4px;
    color:#ffe477;
}

.info{
    margin-top:24px;
    padding:18px;
    border-radius:20px;
    border:1px solid rgba(255,215,90,.38);
    background:rgba(255,255,255,.055);
    box-shadow:
        inset 0 0 20px rgba(255,215,90,.05),
        0 8px 25px rgba(0,0,0,.35);
    text-align:left;
}

.info-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.icon{
    min-width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,214,75,.09);
    font-size:24px;
}

.info-title{
    color:#fff1bd;
    font-size:18px;
    font-weight:bold;
}

.info-text{
    color:#d5d5d5;
    font-size:14px;
    margin-top:4px;
}

/* Center Telegram Button */
.telegram-area{
    margin-top:30px;
    text-align:center;
}

.telegram-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:62px;
    padding:17px 20px;
    border-radius:40px;
    background:linear-gradient(
        90deg,
        #008cff,
        #00c9ff,
        #008cff
    );
    color:#fff;
    text-decoration:none;
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
    box-shadow:
        0 0 12px rgba(0,190,255,.55),
        0 0 30px rgba(0,190,255,.25);
    transition:.18s ease;
}

.telegram-btn:hover{
    transform:translateY(-2px);
}

.telegram-btn:active{
    transform:scale(.97);
}

.telegram-icon{
    font-size:25px;
    margin-right:9px;
}

.rating{
    margin-top:25px;
    padding:17px;
    border-radius:22px;
    border:1px solid rgba(0,255,190,.22);
    background:rgba(0,255,190,.035);
}

.stars{
    font-size:23px;
    letter-spacing:3px;
}

.score{
    margin-top:5px;
    color:#32efbd;
    font-size:24px;
    font-weight:bold;
}

.rating-text{
    margin-top:5px;
    color:#aaa;
    font-size:14px;
}

.managed{
    margin-top:23px;
    color:#999;
    font-size:13px;
    letter-spacing:1.5px;
}

.managed-name{
    margin-top:6px;
    color:#ffe477;
    font-size:17px;

}

.footer{

    color:#666;
    font-size:11px;
